<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Model Benchmark</title>
<style>
:root{font:15px system-ui,sans-serif;color:#20242a;background:#f4f6f8}body{max-width:1500px;margin:22px auto;padding:0 16px}h1{font-size:25px}input,select,button{font:inherit;padding:8px;margin:4px;border:1px solid #c8cdd3;border-radius:5px}button{cursor:pointer;background:#fff}button:disabled{opacity:.55;cursor:wait}.primary{background:#2457c5;color:#fff;border-color:#2457c5}.card{background:#fff;border:1px solid #d8dce1;border-radius:9px;padding:14px;margin:9px 0}.article{cursor:pointer}.muted{color:#66717d}.grid{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}.grid>section{min-width:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.facts-list{max-height:240px;overflow:auto;border:1px solid #e0e3e7;padding:8px}.facts-list label{display:block;padding:4px}.facts-item{border-bottom:1px solid #eee;padding:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f3f5;padding:10px;max-height:460px;overflow:auto}.tag{display:inline-block;background:#edf1f7;border-radius:12px;padding:2px 8px;margin:2px;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<h1>AI Model Benchmark <small class="muted">本文・facts・コメント</small></h1>
<div class="card row"><button id="collect" class="primary">Benchmark記事を合計30件にする</button><span class="muted">カテゴリ別目標なし。NewsData.io検索は最大5回、配信元ページ取得は最大50回です。1,200文字未満でも本文品質を満たせば採用します。</span></div>
<div class="grid"><section><h2>記事一覧</h2><input id="search" placeholder="記事名・IDで検索"><div id="list"></div></section><section id="detail"><p class="muted">記事を選択してください。</p></section></div>
<script>
let data;let selectedArticleId=null;let currentDoc=null;let extraction=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sortByPublishedAt(items){return [...items].sort((a,b)=>{const parse=value=>{const text=String(value??'').trim().replace(' ','T');return text?Date.parse(text):NaN};const at=parse(a.published_at),bt=parse(b.published_at),av=Number.isFinite(at),bv=Number.isFinite(bt);if(av!==bv)return av?-1:1;return av?bt-at:0})}
function renderList(){const q=$('#search').value.toLowerCase();$('#list').innerHTML=sortByPublishedAt(data.articles.filter(a=>Object.values(a).join(' ').toLowerCase().includes(q))).map(a=>`<div class="card article" data-id="${esc(a.article_id)}"><b>${esc(a.article_id)}</b><br>${esc(a.title)}<br><span class="muted">${esc(a.origin)}</span></div>`).join('');document.querySelectorAll('.article').forEach(e=>e.onclick=()=>show(e.dataset.id))}
$('#search').oninput=renderList;
async function renderHistory(id){const target=$('#history-results'),rows=(data.rows||[]).filter(r=>r[1]===id);if(!target)return;if(!rows.length){target.innerHTML='<p class="muted">この記事のBenchmark結果はありません。</p>';return}const items=await Promise.all(rows.map(async r=>({r,detail:await fetch(`results/${r[15]}`).then(x=>x.ok?x.json():null).catch(()=>null)})));target.innerHTML=items.map(({r,detail})=>`<details class="card"><summary><b>${esc(r[3]||r[2])}</b> <span class="muted">${esc(r[5])} / ${esc(r[6])} / ${esc(r[14])} / ${esc(r[0])}</span></summary><pre>${esc(JSON.stringify(detail?.answer??detail?.raw?.output??detail,null,2))}</pre></details>`).join('')}
async function loadFacts(id){const result=await fetch(`/api/facts?article_id=${encodeURIComponent(id)}`).then(r=>r.json());const box=$('#saved-facts');if(!box)return;const items=result.items||[];box.innerHTML=items.length?items.map((x,i)=>`<div class="facts-item"><label><input type="checkbox" class="fact-choice" value="${i}" ${x.status!=='success'||!x.facts.length?'disabled':''}> <b>${esc(x.model.display_name)} — ${esc(x.status)}</b> <span class="muted">${esc(x.created_at)} / ${esc(x.task_mode)} / ${x.facts.length} facts</span></label><pre>${esc(JSON.stringify(x.facts,null,2))}</pre></div>`).join(''):'<span class="muted">保存済みfactsはありません。</span>';box.dataset.items=JSON.stringify(items)}
async function show(id){selectedArticleId=id;const a=data.articles.find(x=>x.article_id===id);currentDoc=await fetch(`dataset/articles/${id}.json`).then(x=>x.json());extraction=null;const opts=data.models.map(m=>`<option value="${esc(m.model_id)}">${esc(m.display_name)}</option>`).join('');const hasBody=Boolean(currentDoc.extracted_body);$('#detail').innerHTML=`<div class="card"><h2>${esc(id)} — ${esc(a.title)}</h2><p>${esc(currentDoc.description||'')}</p><div class="row"><button id="extract">本文を取得</button><button id="save-body" ${hasBody?'disabled':''}>抽出本文を保存</button><span id="body-state" class="muted">${hasBody?`保存済み本文 ${currentDoc.extracted_body.length}文字`:'本文未保存'}</span></div><pre id="body-preview">${esc(currentDoc.extracted_body||'')}</pre></div>
<div class="card"><h2>Benchmark実行</h2><div class="row"><label>比較方式 <select id="task-mode"><option value="body_to_facts">本文 → facts</option><option value="common_facts_to_comments">共通facts → コメント</option><option value="model_facts_to_comments">モデル別facts → コメント</option></select></label><label>実行モデル <select id="run-model">${opts}</select></label></div><p class="muted">コメント比較では下の保存済みfactsを選択してください。共通facts方式は選択factsを統合して1回、モデル別方式はfactsセットごとに1回コメントを生成します。</p><button id="run-test" class="primary">実行</button><span id="run-status" class="muted"></span></div>
<div class="card"><h2>保存済みfacts</h2><div id="saved-facts">読み込み中…</div></div><div class="card"><h2>過去のBenchmark結果</h2><div id="history-results"></div></div><div id="latest-result"></div>`;
const modeSelect=$('#task-mode'),modelSelect=$('#run-model');const syncModels=()=>{const task=modeSelect.value==='body_to_facts'?'facts':'comments';const enabled=data.models.filter(m=>m.enabled_tasks?.includes(task));const current=modelSelect.value;modelSelect.innerHTML=enabled.map(m=>`<option value="${esc(m.model_id)}">${esc(m.display_name)}</option>`).join('');if(enabled.some(m=>m.model_id===current))modelSelect.value=current;};modeSelect.onchange=syncModels;syncModels();
$('#extract').onclick=async()=>{const b=$('#extract');b.disabled=true;$('#body-state').textContent='抽出中…';try{extraction=await fetch('/api/extract',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:currentDoc.source?.url})}).then(r=>r.json());$('#body-preview').textContent=extraction.cleaned_body||'本文を抽出できませんでした。';const good=extraction.cleaned_body?.length>=300&&extraction.extraction_method!=='description_fallback'&&!extraction.failure_reason&&extraction.http_status>=200&&extraction.http_status<300;$('#body-state').textContent=good?`品質確認済み ${extraction.cleaned_body.length}文字。保存できます。`:`保存不可: ${extraction.failure_reason||'本文が極端に短いか、抽出品質を満たしていません。'}`;$('#save-body').disabled=!good;}catch(e){$('#body-state').textContent='本文抽出に失敗しました。'}finally{b.disabled=false}};
$('#save-body').onclick=async()=>{if(!extraction)return;const r=await fetch('/api/body/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({article_id:id,extraction})});const out=await r.json();$('#body-state').textContent=r.ok?`本文を保存しました（${out.body_chars}文字）`:`保存できません: ${out.error}`;if(r.ok){currentDoc=await fetch(`dataset/articles/${id}.json`).then(x=>x.json());$('#save-body').disabled=true;}};
$('#run-test').onclick=async()=>{const mode=$('#task-mode').value,modelId=$('#run-model').value;const choices=[...document.querySelectorAll('.fact-choice:checked')].map(x=>JSON.parse($('#saved-facts').dataset.items)[Number(x.value)]);if(mode!=='body_to_facts'&&!choices.length){$('#run-status').textContent='factsセットを1つ以上選択してください。';return}if(mode==='body_to_facts'&&!currentDoc.extracted_body){$('#run-status').textContent='先に本文を抽出して保存してください。';return}const jobs=mode==='common_facts_to_comments'?[{facts:[...new Set(choices.flatMap(x=>x.facts))],source:choices.map(x=>x.file)}]:mode==='model_facts_to_comments'?choices.map(x=>({facts:x.facts,source:[x.file]})):[{facts:null,source:[]}];if(!confirm(`記事: ${id}\n方式: ${mode}\nモデル: ${data.models.find(m=>m.model_id===modelId).display_name}\n外部API呼び出し予定: ${jobs.length}回\n実行しますか？`))return;const button=$('#run-test');button.disabled=true;try{const results=[];for(const job of jobs){const payload={article_id:id,model_id:modelId,task:mode==='body_to_facts'?'facts':'comments',task_mode:mode,confirm:true,allow_external:true,facts:job.facts,source_facts:job.source};const response=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const result=await response.json();results.push(result);if(!response.ok)throw new Error(result.error||'実行に失敗しました');}$('#latest-result').innerHTML=results.map(x=>`<div class="card"><b>${esc(x.detail?.status||'')}</b> <span class="muted">${esc(x.facts_file||'')}</span><pre>${esc(JSON.stringify(x.detail?.answer??x,null,2))}</pre></div>`).join('');$('#run-status').textContent='完了しました。';const fresh=await fetch('data.json').then(r=>r.json());data.rows=fresh.rows;await loadFacts(id);await renderHistory(id);}catch(e){$('#run-status').textContent=e.message}finally{button.disabled=false}};
await loadFacts(id);await renderHistory(id)}
$('#collect').onclick=async()=>{const calls='不足分を補う収集。NewsData.io検索 最大5回（資料上200 credits/day・30 requests/15分）。記事ページHTTP要求 最大50回（リダイレクト込み）。';if(!confirm(`記事収集を開始します。\n${calls}\n本文300文字以上・本文品質合格を採用条件とします。重複と広告・関連記事が多い本文は除外します。続けますか？`))return;const button=$('#collect');button.disabled=true;try{const response=await fetch('/api/collect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({confirm:true,allow_external:true})});const result=await response.json();alert(JSON.stringify(result,null,2));if(result.total_collected>=30){data=await fetch('data.json').then(r=>r.json());renderList()}}catch(e){alert(e.message)}finally{button.disabled=false}};
fetch('data.json').then(r=>r.json()).then(x=>{data=x;renderList()});
</script></body></html>
