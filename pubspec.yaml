name: news_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_mobile_ads: ^9.1.0
  xml: ^7.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.2
  share_plus: ^10.1.0
  url_launcher: ^6.3.2
  characters: ^1.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/aisoku_icon.png"
  adaptive_icon_background: "#01A6FE"
  adaptive_icon_foreground: "assets/icon/aisoku_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
